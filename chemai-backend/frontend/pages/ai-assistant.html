<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI助手 · 教师智能助手 · ChemAI 智辅化学</title>
  <!-- 依据 stitch-prototypes/index.html 教师智能助手原型实现；SSE 管线复用 js/api.js
       agentChatStream / agentApprovalResume，context 按角色推导 persona=teacher（防提权 B1）。 -->
  <link rel="stylesheet" href="vendor/katex.min.css" />
  <script src="vendor/katex.min.js"></script>
  <script src="vendor/mhchem.min.js"></script>
  <script src="vendor/auto-render.min.js"></script>
  <script src="vendor/marked.min.js"></script>
  <style>
    :root {
      --oxford: #002045;
      --teal: #13696a;
      --teal-soft: #e0f2f1;
      --navy: #1a1a2e;
      --paper: #faf8f5;
      --border: #e5e1d8;
      --text: #1c2430;
      --muted: #6b7280;
      --shadow: rgba(0, 0, 0, 0.06);
      --serif: "Cormorant Garamond", "Noto Serif SC", Georgia, serif;
      --sans: "IBM Plex Sans", "Noto Sans SC", -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--sans);
      color: var(--text);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .app { display: flex; height: 100vh; min-width: 1080px; overflow: hidden; }

    /* ============ SIDEBAR ============ */
    .sidebar {
      width: 232px; flex: 0 0 232px; background: var(--navy); color: #cfd2dc;
      display: flex; flex-direction: column; padding: 22px 16px 18px;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 20px; }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 50%; background: var(--teal);
      display: flex; align-items: center; justify-content: center; flex: 0 0 34px;
    }
    .brand-name { font-family: var(--serif); font-size: 22px; font-weight: 700; color: #fff; line-height: 1; }
    .brand-sub { font-size: 11px; color: #8b8fa3; letter-spacing: 2px; margin-top: 2px; }

    .new-chat {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
      background: var(--teal); color: #fff; border: none; border-radius: 8px; padding: 11px 12px;
      font-family: var(--sans); font-size: 14px; font-weight: 600; cursor: pointer;
      transition: background 0.15s ease;
    }
    .new-chat:hover { background: #158081; }
    .new-chat:disabled { opacity: .6; cursor: not-allowed; }

    .history { margin-top: 22px; flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .history-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #6d7188; padding: 0 8px 8px; }
    .history-item { padding: 9px 10px; border-radius: 8px; cursor: pointer; transition: background 0.15s ease; }
    .history-item:hover { background: rgba(255, 255, 255, 0.05); }
    .history-item.active { background: rgba(255, 255, 255, 0.09); }
    .history-item .t { font-size: 13.5px; color: #e6e8ef; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-item .ts { font-size: 11px; color: #797d92; margin-top: 3px; }
    .history-empty { font-size: 12px; color: #6d7188; padding: 6px 10px; }

    .side-nav {
      margin-top: auto; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.07);
      display: flex; justify-content: space-around;
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      background: none; border: none; color: #8b8fa3; cursor: pointer; text-decoration: none;
      font-family: var(--sans); font-size: 11px; padding: 4px 6px; border-radius: 8px; transition: color 0.15s ease;
    }
    .nav-btn:hover { color: #fff; }
    .nav-btn.active { color: #fff; }
    .nav-btn svg { width: 20px; height: 20px; }

    /* ============ MAIN ============ */
    .main { flex: 1 1 auto; display: flex; flex-direction: column; background: var(--paper); min-width: 0; }

    .context-bar {
      display: flex; align-items: center; justify-content: space-between; background: #fff;
      border-bottom: 1px solid var(--border); padding: 12px 32px; gap: 12px;
    }
    .context-left { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 500; color: var(--text); }
    .ctx-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); flex: 0 0 8px; }
    .class-sel {
      border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
      font-family: var(--sans); font-size: 13.5px; color: var(--oxford); background: #fff; font-weight: 500;
    }
    .ctx-link { font-size: 13px; color: var(--teal); text-decoration: none; font-weight: 500; white-space: nowrap; }
    .ctx-link:hover { text-decoration: underline; }

    /* ---- messages ---- */
    .messages { flex: 1 1 auto; overflow-y: auto; padding: 28px 32px 8px; }
    .msg-col { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

    .msg { display: flex; }
    .msg.user { justify-content: flex-end; }
    .msg.ai { justify-content: flex-start; }

    .bubble { max-width: 78%; padding: 14px 18px; border-radius: 12px; font-size: 14.5px; line-height: 1.65; }
    .bubble.user { background: #fff; border: 1px solid var(--border); color: var(--text); }
    .bubble.ai { background: var(--teal-soft); color: #163a3a; }
    .bubble p { margin: 6px 0; }
    .bubble p:first-child { margin-top: 0; }
    .bubble ul, .bubble ol { margin: 6px 0; padding-left: 20px; }
    .bubble li { margin-bottom: 5px; }
    .bubble strong { color: var(--teal); }
    .bubble h4 { font-size: 14px; font-weight: 700; margin: 12px 0 6px; color: var(--oxford); }
    .bubble code { background: rgba(0, 32, 69, 0.06); border-radius: 4px; padding: 1px 5px; font-size: 13px; }
    .bubble a { color: var(--teal); }

    .msg-avatar {
      width: 34px; height: 34px; border-radius: 50%; background: var(--oxford); flex: 0 0 34px;
      display: flex; align-items: center; justify-content: center; margin-right: 12px;
    }

    .stage-tag {
      display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
      font-size: 12px; color: var(--teal); font-weight: 600; margin-bottom: -14px;
    }
    .stage-tag .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); animation: pulse 1.6s infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(19, 105, 106, 0.5); }
      70% { box-shadow: 0 0 0 7px rgba(19, 105, 106, 0); }
      100% { box-shadow: 0 0 0 0 rgba(19, 105, 106, 0); }
    }

    .degrade-card {
      font-size: 13.5px; color: var(--muted);
    }
    .degrade-card .retry { color: var(--teal); cursor: pointer; text-decoration: underline; }

    /* ---- tool card ---- */
    .tool-card {
      max-width: 78%; align-self: flex-start; background: #fff; border: 1px solid var(--border);
      border-left: 3px solid var(--teal); border-radius: 8px; padding: 12px 16px;
      box-shadow: 0 1px 3px var(--shadow);
    }
    .tool-card.fail { border-left-color: #c0392b; }
    .tool-head { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .tool-head svg { width: 17px; height: 17px; color: var(--teal); }
    .tool-name { font-family: var(--sans); font-size: 13.5px; font-weight: 600; color: var(--oxford); font-variant-ligatures: none; }
    .tool-chevron { color: var(--muted); font-size: 11px; }
    .tool-status { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--teal); background: var(--teal-soft); padding: 2px 9px; border-radius: 16px; }
    .tool-card.fail .tool-status { color: #c0392b; background: #fdecea; }
    .tool-body { margin-top: 10px; font-size: 13px; color: var(--muted); font-family: var(--sans); }
    .tool-args { background: var(--paper); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

    /* ---- rich results ---- */
    .rich { display: flex; flex-direction: column; gap: 8px; }
    .rich-title { font-weight: 700; color: var(--oxford); font-size: 13.5px; }
    .rich-sub { font-size: 12.5px; color: var(--muted); }
    .bar-row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
    .bar-label { flex: 0 0 74px; color: var(--text); }
    .bar-track { flex: 1 1 auto; height: 8px; background: #eef0f2; border-radius: 8px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--teal); border-radius: 8px; }
    .bar-val { flex: 0 0 42px; text-align: right; color: var(--teal); font-weight: 600; }
    .rich-flag { font-size: 12.5px; color: var(--oxford); font-weight: 600; }
    .kv { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; }
    .kv span { color: var(--muted); }
    .kv b { color: var(--text); font-weight: 500; }
    .kv-list { display: flex; flex-direction: column; gap: 4px; background: var(--paper); border-radius: 6px; padding: 8px 10px; margin-top: 4px; }
    .rich-json { font-size: 12px; white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .q-card { background: var(--paper); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; }
    .q-index { font-size: 11px; color: var(--teal); font-weight: 700; }
    .q-stem { font-size: 13px; color: var(--text); }
    .q-opts { font-size: 12.5px; color: var(--text); }
    .q-answer { font-size: 12.5px; color: var(--teal); font-weight: 600; }
    .q-analysis { font-size: 12px; color: var(--muted); }
    .s-card { display: flex; justify-content: space-between; align-items: center; background: var(--paper); border-radius: 8px; padding: 8px 12px; }
    .s-name { font-size: 13px; color: var(--text); font-weight: 600; }
    .s-tag { font-size: 12px; color: var(--teal); background: var(--teal-soft); border-radius: 12px; padding: 2px 10px; }
    .btn-confirm-adaptive {
      align-self: flex-start; margin-top: 4px; border: none; border-radius: 8px;
      background: var(--oxford); color: #fff; font-family: var(--sans); font-size: 13px; font-weight: 600;
      padding: 9px 18px; cursor: pointer; transition: background .15s ease;
    }
    .btn-confirm-adaptive:hover { background: #063a70; }
    .btn-confirm-adaptive:disabled { opacity: .6; cursor: not-allowed; }
    .btn-confirm-adaptive.active { background: var(--teal); }

    /* ---- approval card (D13) ---- */
    .approval-card {
      align-self: flex-start; max-width: 78%; background: #fff; border: 1px solid #f0c36d;
      border-left: 3px solid #f0a500; border-radius: 8px; padding: 14px 16px;
      display: flex; flex-direction: column; gap: 8px; box-shadow: 0 1px 4px var(--shadow);
    }
    .approval-title { font-size: 14px; font-weight: 700; color: #8a5a00; }
    .approval-tool { font-size: 13px; color: var(--text); }
    .approval-actions { display: flex; gap: 10px; margin-top: 2px; }
    .btn-approve {
      border: none; border-radius: 8px; background: var(--teal); color: #fff;
      font-family: var(--sans); font-size: 13px; font-weight: 600; padding: 8px 16px; cursor: pointer;
    }
    .btn-reject {
      border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--muted);
      font-family: var(--sans); font-size: 13px; font-weight: 500; padding: 8px 16px; cursor: pointer;
    }

    /* ============ COMPOSER ============ */
    .composer-region { padding: 8px 32px 14px; }
    .composer-inner { max-width: 960px; margin: 0 auto; }

    .chips { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 14px; }
    .chip {
      background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 7px 14px;
      font-family: var(--sans); font-size: 13px; color: #4b5563; cursor: pointer; transition: all 0.15s ease;
    }
    .chip:hover { border-color: var(--teal); color: var(--teal); }

    .input-box { background: #fff; border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 2px 8px var(--shadow); overflow: hidden; }

    .formula-bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .formula-label { font-size: 11px; color: var(--muted); margin-right: 4px; }
    .fbtn {
      min-width: 34px; height: 32px; padding: 0 8px; background: #fff; border: 1px solid var(--border);
      border-radius: 8px; font-family: var(--sans); font-size: 14px; color: var(--text); cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.15s ease;
    }
    .fbtn:hover { border-color: var(--teal); color: var(--teal); }
    .fbtn sub { font-size: 10px; }

    .input-row { display: flex; align-items: flex-end; gap: 10px; padding: 12px 14px; }
    textarea.composer {
      flex: 1 1 auto; border: none; outline: none; resize: none; font-family: var(--sans);
      font-size: 14.5px; line-height: 1.5; color: var(--text); background: transparent;
      max-height: 160px; min-height: 26px; padding: 4px 0;
    }
    textarea.composer::placeholder { color: #9ca3af; }
    textarea.composer:disabled { color: #b0b7c0; }

    .icon-btn {
      width: 38px; height: 38px; border-radius: 8px; border: none; background: transparent;
      color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s ease, color 0.15s ease; flex: 0 0 38px;
    }
    .icon-btn:hover { background: var(--paper); color: var(--text); }
    .icon-btn svg { width: 20px; height: 20px; }

    .send-btn {
      width: 44px; height: 44px; flex: 0 0 44px; border-radius: 50%; border: none; background: var(--oxford);
      color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s ease;
    }
    .send-btn:hover { background: #063a70; }
    .send-btn:disabled { background: #9aa4b0; cursor: not-allowed; }
    .send-btn svg { width: 20px; height: 20px; }

    .status-bar { display: flex; align-items: center; justify-content: space-between; max-width: 960px; margin: 10px auto 0; padding: 0 2px; }
    .status-left { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
    .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); }
    .status-hint { font-size: 12px; color: #9ca3af; }
    .status-hint kbd { font-family: var(--sans); font-size: 11px; background: #fff; border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }

    /* toast */
    .toast {
      position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
      background: var(--oxford); color: #fff; font-size: 13px; padding: 10px 20px;
      border-radius: 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18); z-index: 99; display: none;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #d6d3cd; border-radius: 8px; }
    .history::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); }
  </style>
</head>

    <!-- ============ SIDEBAR ============ -->

      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

          </svg>

        <span>
          <span class="brand-name">ChemAI</span>
          <span class="brand-sub">智辅化学</span>
        </span>
      </div>

      <button class="new-chat" id="newChatBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        新建对话
      </button>

      <nav class="history" id="history" aria-label="历史对话">
        <span class="history-label">历史对话</span>
        <div class="history-empty">对话记录即将上线</div>
      </nav>

      <nav class="side-nav" aria-label="主导航">
        <button class="nav-btn active" title="AI 助手">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
          首页
        </button>
        <a class="nav-btn" href="exam-v2.html" title="考试工作台">

          工作台
        </a>
        <a class="nav-btn" href="panel.html" title="学情面板">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><rect x="5" y="11" width="3" height="7"/><rect x="10.5" y="7" width="3" height="11"/><rect x="16" y="13" width="3" height="5"/></svg>

        </a>
        <a class="nav-btn" href="students.html" title="学生管理">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>

    <!-- ============ MAIN ============ -->
    <main class="main">
      <div class="context-bar">

          <span class="ctx-dot"></span>
          当前班级
          <select class="class-sel" id="classSel" aria-label="当前班级"></select>

              <button class="fbtn" type="button" data-ins="Δ" title="加热条件">Δ</button>

            <div class="input-row">
              <textarea class="composer" id="chatInput" rows="1" placeholder="输入你的教学需求，例如：帮我设计一节45分钟的氧化还原复习课…" aria-label="消息输入框"></textarea>

  </div>
  <div class="toast" id="toast"></div>

  <script>
    (function () {
      'use strict';
      const A = window.ChemAPI;
      const $ = (id) => document.getElementById(id);

      // 教师端门控：登录态 + 教师级角色，越权回 forbidden
      if (!window.ChemAuth.requireAuth()) return;
      if (!window.ChemAuth.isTeacherLike()) { location.href = 'forbidden.html?side=teacher'; return; }

      const me = window.ChemAuth.getUser();
      const chat = $('chat');
      const input = $('chatInput');
      const statusText = $('statusText');

      const PHASE_LABEL = {
        thinking: '分析中', executing: '执行中', planning: '规划中',
        reply: '回复中', awaiting_approval: '等待确认',
      };
      // 快捷芯片：班级相关的用当前班级名填充，点击即发送
      const CHIP_TEMPLATES = [
        (c) => '出3道氧化还原题',
        (c) => '分析' + c + '月考成绩',
        (c) => '统计' + c + '最近考试错题',
        () => '生成离子反应知识点总结',
        () => '针对氧化还原薄弱点推荐教学策略',
        (c) => '查看' + c + '学生薄弱点',
      ];

      const THREAD_KEY = 'chemai_ai_assistant_thread';  // 跨 tab 持久化：记住最近会话
      let threadId = localStorage.getItem(THREAD_KEY) || '';
      let busy = false;
      let curAiText = '';
      let lastText = '';
      let currentChat = null;
      let aiElRef = null;          // 当前 AI 气泡（富渲染/审批卡片挂载）
      let toolArgsBuffers = {};    // tool_call_id -> {argsText}（8.1 delta 累积）
      let pendingApproval = null;  // {tool, args, threadId}（D13 待审批）
      let currentClass = '';
      let historyItems = [];   // 历史会话列表缓存（renderHistoryList 用，避免重复请求）

      // 会话键：`{JWT 主体}:{thread_id}`，thread_id 不得含 ":"（后端 D14 校验）
      // 前缀须为 conv_（后端 thread_created_ms 解析该格式出时间戳）
      function makeThreadId() {
        return 'conv_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
      }

      // ---------------- 会话跨 tab 持久化 + 历史回放（学生端同款） ----------------
      function persistThreadId() {
        try { localStorage.setItem(THREAD_KEY, threadId); } catch (err) { /* 存储不可用则忽略 */ }
      }
      function fmtThreadTime(ms) {
        if (!ms) return '';
        const d = new Date(ms);
        const now = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
        if (d.toDateString() === now.toDateString()) return '今天 ' + hm;
        const y = new Date(now); y.setDate(now.getDate() - 1);
        if (d.toDateString() === y.toDateString()) return '昨天 ' + hm;
        return (d.getMonth() + 1) + '月' + d.getDate() + '日';
      }
      function renderHistoryList(items) {
        const el = $('history');
        el.innerHTML = '<span class="history-label">历史对话</span>';
        if (!items.length) {
          el.innerHTML += '<div class="history-empty">暂无历史对话</div>';
          return;
        }
        items.forEach((t) => {
          const item = document.createElement('div');
          item.className = 'history-item' + (t.thread_id === threadId ? ' active' : '');
          item.dataset.tid = t.thread_id;
          item.innerHTML = '<div class="t">' + escapeHtml(t.title || '新对话') + '</div>' +
            '<div class="ts">' + escapeHtml(fmtThreadTime(t.created_ms)) + '</div>';
          el.appendChild(item);
        });
      }
      function loadHistoryList() {
        A.agentThreads().then((data) => {
          historyItems = (data && data.threads) || [];
          renderHistoryList(historyItems);
        }).catch(() => {
          historyItems = [];
          renderHistoryList(historyItems);
        });
      }
      async function loadThread(tid) {
        if (currentChat) currentChat.cancel();
        currentChat = null;
        stallReset();
        busy = false;
        threadId = tid;
        persistThreadId();
        curAiText = '';
        lastText = '';
        pendingApproval = null;
        aiElRef = null;
        toolArgsBuffers = {};
        lockInput(false);
        setStatus('Agent 就绪');
        clearStage();
        chat.innerHTML = '';
        let messages = [];
        try {
          const data = await A.agentThreadMessages(tid);
          messages = (data && data.messages) || [];
        } catch (err) {
          renderHistoryList(historyItems);
          addWelcome();
          return;
        }
        if (!messages.length) { renderHistoryList(historyItems); addWelcome(); return; }
        messages.forEach((m) => {
          if (m.role === 'user') {
            appendUser(m.content);
          } else if (m.role === 'assistant' && String(m.content || '').trim()) {
            curAiText = m.content;
            newAiBubble();
            renderAi(aiElRef);
          }
        });
        curAiText = '';
        // 回放消息的 renderMarkdown 不渲染 KaTeX，统一在全部气泡插入后渲染一次
        if (window.ChemKaTeX) window.ChemKaTeX.render(chat);
        renderHistoryList(historyItems);
        scrollChat();
      }

      // ---------------- toast / 状态 ----------------
      function toast(msg, ms) {
        const t = $('toast');
        t.textContent = msg;
        t.style.display = 'block';
        clearTimeout(t._timer);
        t._timer = setTimeout(() => { t.style.display = 'none'; }, ms || 2200);
      }
      function setStatus(s) { statusText.textContent = s; }

      // ---------------- 班级选择 ----------------
      function populateClasses() {
        A.getClasses()
          .then((d) => {
            const items = (d && d.items) || [];
            const sel = $('classSel');
            if (!items.length) {
              sel.innerHTML = '<option value="">未配置班级</option>';
              return;
            }
            sel.innerHTML = items.map((c, i) =>
              '<option value="' + escapeHtml(c.name) + '">' + escapeHtml(c.name) + '</option>').join('');
            currentClass = items[0].name;
            sel.value = currentClass;
          })
          .catch(() => {
            $('classSel').innerHTML = '<option value="">未配置班级</option>';
          });
      }
      $('classSel').addEventListener('change', (e) => {
        currentClass = e.target.value || '';
        renderChips();
      });

      // ---------------- 快捷芯片 ----------------
      function renderChips() {
        const cls = currentClass || '高一(3)班';
        const row = $('chipRow');
        row.innerHTML = '';
        CHIP_TEMPLATES.forEach((tpl) => {
          const c = document.createElement('button');
          c.className = 'chip';
          c.type = 'button';
          c.textContent = tpl(cls);
          c.addEventListener('click', () => { input.value = c.textContent; input.focus(); });
          row.appendChild(c);
        });
      }

      // ---------------- 化学符号插入（光标处） ----------------
      function insertAtCursor(text) {
        const start = input.selectionStart;
        const end = input.selectionEnd;
        input.value = input.value.slice(0, start) + text + input.value.slice(end);
        const pos = start + text.length;
        input.setSelectionRange(pos, pos);
        input.focus();
        autoGrow();
      }
      Array.prototype.forEach.call(document.querySelectorAll('.fbtn'), (b) => {
        b.addEventListener('click', () => insertAtCursor(b.dataset.ins || b.textContent));
      });
      function autoGrow() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 160) + 'px';
      }
      input.addEventListener('input', autoGrow);

      // ---------------- 消息渲染 ----------------
      function scrollChat() { chat.scrollTop = chat.scrollHeight; }
      function addWelcome() {
        const w = document.createElement('div');
        w.className = 'bubble ai';
        w.textContent = '你好，' + ((me && me.name) || '老师') + '！我是 ChemAI 教研助手。可以帮你出题、分析班级学情、诊断学生薄弱点、准备考试。';
        chat.appendChild(w);
        scrollChat();
      }
      function setStage(p) {
        clearStage();
        const label = PHASE_LABEL[p] || '';
        if (label) setStatus(label);
        if (!label) return;
        const tag = document.createElement('div');
        tag.className = 'stage-tag';
        tag.id = 'stageTag';
        tag.innerHTML = '<span class="dot"></span>' + escapeHtml(label);
        const rows = chat.querySelectorAll('.msg.ai');
        const lastRow = rows[rows.length - 1];
        if (lastRow) chat.insertBefore(tag, lastRow);
        else chat.appendChild(tag);
        scrollChat();
      }
      function clearStage() {
        const t = $('stageTag');
        if (t) t.remove();
      }

      function appendUser(text) {
        const row = document.createElement('div');
        row.className = 'msg user';
        const div = document.createElement('div');
        div.className = 'bubble user';
        div.textContent = text;
        row.appendChild(div);
        chat.appendChild(row);
        scrollChat();
      }
      function newAiBubble() {
        const row = document.createElement('div');
        row.className = 'msg ai';
        const av = document.createElement('div');
        av.className = 'msg-avatar';
        av.setAttribute('aria-hidden', 'true');
        av.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6.5L4.8 18a2 2 0 0 0 1.7 3h11a2 2 0 0 0 1.7-3L14 9.5V3"/></svg>';
        const div = document.createElement('div');
        div.className = 'bubble ai';
        row.appendChild(av);
        row.appendChild(div);
        chat.appendChild(row);
        aiElRef = div;
        toolArgsBuffers = {};
        scrollChat();
        return div;
      }
      function renderAi(el) { el.innerHTML = renderMarkdown(stripLeadingJson(curAiText)); }

      function lockInput(locked) {
        $('sendBtn').disabled = locked;
        input.disabled = locked;
        if (!locked) input.focus();
      }

      // ---------------- 工具卡片 ----------------
      function buildToolCard(d, statusText) {
        const name = d.tool || d.name || '工具';
        const row = document.createElement('div');
        row.className = 'msg ai';
        const card = document.createElement('div');
        card.className = 'tool-card';
        card.dataset.key = String(d.tool_call_id || d.id || name);
        card.innerHTML =
          '<div class="tool-head">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2-2z"/></svg>' +
          '<span class="tool-name">' + escapeHtml(name) + '</span>' +
          '<span class="tool-chevron">▾</span>' +
          '<span class="tool-status">' + escapeHtml(statusText) + '</span>' +
          '</div>' +
          '<div class="tool-body" style="display:none"></div>';
        const head = card.querySelector('.tool-head');
        head.addEventListener('click', () => toggleToolCard(card));
        row.appendChild(card);
        chat.appendChild(row);
        scrollChat();
        return card;
      }
      function toggleToolCard(card) {
        const body = card.querySelector('.tool-body');
        const chev = card.querySelector('.tool-chevron');
        const collapsed = body.style.display !== 'none';
        body.style.display = collapsed ? 'none' : 'block';
        if (chev) chev.textContent = collapsed ? '▸' : '▾';
      }
      function addToolCard(d) {
        buildToolCard(d, '执行中…');
      }
      function updateToolCard(d) {
        const key = String(d.tool_call_id || d.id || (d.tool || d.name || ''));
        let target = Array.prototype.find.call(chat.querySelectorAll('.tool-card'), (c) => c.dataset.key === key);
        if (!target) target = buildToolCard(d, '完成');
        const fail = d.success === false;
        target.classList.add(fail ? 'fail' : 'ok');
        const st = target.querySelector('.tool-status');
        if (st) st.textContent = fail ? '失败' : '完成';
        const name = d.tool || d.name;
        if (name) {
          const n = target.querySelector('.tool-name');
          if (n) n.textContent = escapeHtml(name);
        }
        const body = target.querySelector('.tool-body');
        if (d.result && body) {
          if (fail && (d.error === 'requires_approval_blocked' || (d.result && d.result.error === 'requires_approval_blocked'))) {
            body.innerHTML = '<div class="tool-args">该操作需要你确认后才执行</div>';
          } else {
            body.innerHTML = renderToolResult(d.result);
            window.ChemKaTeX.render(body);
          }
          target.classList.remove('collapsed');
          body.style.display = 'block';
          scrollChat();
        }
      }

      // ---- 8.1 工具参数骨架：tool_args delta 按 call id 累积（preparing→executing 渐显） ----
      function accumulateArgs(d) {
        const id = d.tool_call_id;
        if (!id) return;
        const buf = toolArgsBuffers[id] || (toolArgsBuffers[id] = { argsText: '' });
        buf.argsText += d.delta || '';
        renderArgsSkeleton(id, buf.argsText);
      }
      function renderArgsSkeleton(id, argsText) {
        const target = Array.prototype.find.call(chat.querySelectorAll('.tool-card'), (c) => c.dataset.key === id);
        if (!target) return;
        const body = target.querySelector('.tool-body');
        if (!body) return;
        let sk = target.querySelector('.tool-args');
        if (!sk) {
          sk = document.createElement('div');
          sk.className = 'tool-args';
          body.appendChild(sk);
        }
        sk.textContent = argsText;
      }

      // ---- 8.2 富渲染器：按结果形状分发（工具结果来自真实后端） ----
      function pct(v) {
        const n = Number(v);
        return isFinite(n) ? Math.round(n * 100) + '%' : '—';
      }
      function renderBarrierOverview(r) {
        const parts = ['<div class="rich">'];
        if (r.name || r.class_name) parts.push('<div class="rich-title">' + escapeHtml(r.name || r.class_name) + '</div>');
        const profile = r.profile || {};
        const dist = r.distribution || {};
        const dims = [['概念理解', 'concept'], ['阅读理解', 'reading'], ['表达书写', 'expression']];
        let drew = false;
        for (const [label, k] of dims) {
          const v = profile[k];
          if (v === undefined || v === null) continue;
          drew = true;
          parts.push('<div class="bar-row"><span class="bar-label">' + label + '</span>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + pct(v) + '"></div></div>' +
            '<span class="bar-val">' + pct(v) + '</span></div>');
        }
        if (!drew && dist.axis !== undefined && dist.axis !== null) {
          parts.push('<div class="bar-row"><span class="bar-label">平均障碍指数</span>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + pct(dist.axis) + '"></div></div>' +
            '<span class="bar-val">' + pct(dist.axis) + '</span></div>');
        }
        if (r.total_students) parts.push('<div class="rich-sub">共 ' + escapeHtml(String(r.total_students)) + ' 人</div>');
        if (r.dominant_label) parts.push('<div class="rich-flag">主要障碍：' + escapeHtml(r.dominant_label) + '</div>');
        parts.push('</div>');
        return parts.join('');
      }
      function renderQuestionCards(r) {
        const qs = r.questions || [];
        const parts = ['<div class="rich">'];
        if (r.knowledge_points && r.knowledge_points.length) {
          parts.push('<div class="rich-title">知识点：' + r.knowledge_points.map((p) => escapeHtml(String(p))).join('、') + '</div>');
        }
        qs.forEach((q, i) => {
          const opts = (q.options || []).map((o, j) =>
            '<div class="q-opts">' + String.fromCharCode(65 + j) + '. ' + escapeHtml(String(o)) + '</div>').join('');
          parts.push('<div class="q-card">' +
            '<div class="q-index">第 ' + (i + 1) + ' 题</div>' +
            '<div class="q-stem">' + escapeHtml(String(q.content || q.stem || '')) + '</div>' +
            (opts ? opts : '') +
            '<div class="q-answer">答案：' + escapeHtml(String(q.answer || '')) + '</div>' +
            (q.analysis ? '<div class="q-analysis">解析：' + escapeHtml(String(q.analysis)) + '</div>' : '') +
            '</div>');
        });
        parts.push('</div>');
        return parts.join('');
      }
      function renderStudentList(r) {
        const items = r.items || r.students || [];
        const parts = ['<div class="rich">'];
        if (r.class_name) parts.push('<div class="rich-title">' + escapeHtml(r.class_name) + '</div>');
        if (r.total !== undefined) parts.push('<div class="rich-sub">共 ' + escapeHtml(String(r.total)) + ' 人</div>');
        items.forEach((s) => {
          parts.push('<div class="s-card">' +
            '<div class="s-name">' + escapeHtml(String(s.name || '学生')) + '</div>' +
            '<div class="s-tag">' + escapeHtml(String(s.dominant_label || s.dominant_barrier || '')) + '</div>' +
            '</div>');
        });
        parts.push('</div>');
        return parts.join('');
      }
      function renderAdaptivePreview(r) {
        const items = r.results || [];
        const parts = ['<div class="rich">'];
        if (r.class_name) parts.push('<div class="rich-title">' + escapeHtml(r.class_name) + ' 自适应练习预览</div>');
        if (!items.length) {
          parts.push('<div class="rich-sub">该班级暂无学生，无法预览</div></div>');
          return parts.join('');
        }
        const confirmable = [];
        items.forEach((it) => {
          const kps = (it.knowledge_points || []).map((k) => escapeHtml(String(k))).join('、');
          const hasRefs = Array.isArray(it.question_refs) && it.question_refs.length > 0;
          parts.push('<div class="q-card">' +
            '<div class="rich-title">' + escapeHtml(String(it.student_name || ('学生 #' + it.student_id))) + '</div>' +
            '<div class="rich-sub">难度 ' + escapeHtml(String(it.difficulty || '')) + ' · ' + it.question_count + ' 题</div>' +
            (kps ? '<div class="rich-sub">知识点：' + kps + '</div>' : '') +
            (hasRefs ? '' : '<div class="rich-sub">暂无匹配题目，无法下发</div>') +
            '</div>');
          if (hasRefs) confirmable.push({ student_id: it.student_id, question_refs: it.question_refs });
        });
        if (r.remaining > 0) parts.push('<div class="rich-sub">另有 ' + r.remaining + ' 名学生未预览（每批上限 5 人）</div>');
        if (confirmable.length) {
          const payload = encodeURIComponent(JSON.stringify({ class_id: r.class_id, items: confirmable }));
          parts.push('<button class="btn-confirm-adaptive" data-payload="' + payload + '">确认下发</button>');
        } else {
          parts.push('<div class="rich-sub">暂无匹配题目，请调整筛选或稍后再试</div>');
        }
        parts.push('</div>');
        return parts.join('');
      }
      function confirmAdaptive(btn) {
        let payload;
        try {
          payload = JSON.parse(decodeURIComponent(btn.dataset.payload || '{}'));
        } catch (_err) {
          toast('预览数据异常，请重新生成预览'); return;
        }
        if (!payload.class_id || !(payload.items || []).length) {
          toast('无有效的预览数据'); return;
        }
        const original = btn.textContent;
        btn.disabled = true;
        btn.textContent = '下发中…';
        fetch('/api/practice/adaptive/confirm', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (window.ChemAuth.getToken ? window.ChemAuth.getToken() : ''),
          },
          body: JSON.stringify(payload),
        })
          .then(async (resp) => {
            const body = await resp.json().catch(() => ({}));
            if (!resp.ok) {
              toast('下发失败：' + ((body && body.detail) || resp.status));
              btn.disabled = false;
              btn.textContent = original;
              return;
            }
            const n = (body.results || []).length;
            btn.textContent = '✓ 已下发 ' + n + ' 人';
            btn.classList.add('active');
          })
          .catch(() => {
            toast('网络异常，下发失败');
            btn.disabled = false;
            btn.textContent = original;
          });
      }
      function renderGenericResult(r) {
        if (r === null || r === undefined) return '';
        if (typeof r === 'string') return renderMarkdown(r);
        if (typeof r !== 'object') return escapeHtml(String(r));
        const textKeys = ['summary', 'message', 'text', 'description'];
        for (const k of textKeys) {
          if (typeof r[k] === 'string' && r[k]) {
            const extra = Object.keys(r).filter((x) => !textKeys.includes(x)).map((x) =>
              '<div class="kv"><span>' + escapeHtml(x) + '</span><b>' + escapeHtml(String(r[x])) + '</b></div>').join('');
            return renderMarkdown(r[k]) + (extra ? '<div class="kv-list">' + extra + '</div>' : '');
          }
        }
        return '<pre class="rich-json">' + escapeHtml(JSON.stringify(r, null, 2)) + '</pre>';
      }
      function renderToolResult(r) {
        if (r === null || r === undefined) return '';
        if (Array.isArray(r.questions) && r.questions.length) return renderQuestionCards(r);
        if (Array.isArray(r.results) && (r.class_id !== undefined || (r.results[0] && Array.isArray(r.results[0].question_refs)))) return renderAdaptivePreview(r);
        if (r.distribution || r.profile || r.dominant_label) return renderBarrierOverview(r);
        if (Array.isArray(r.items) && r.items.length) return renderStudentList(r);
        return renderGenericResult(r);
      }

      // ---- 6.2 审批卡片（D13）：awaiting_approval → 确认/取消 → 恢复端点重开流 ----
      function stashApproval(d) {
        const r = d.result || {};
        if (d.error === 'requires_approval_blocked' || r.error === 'requires_approval_blocked') {
          pendingApproval = { tool: r.tool || d.tool || '工具', args: r.args || {}, threadId: threadId };
        }
      }
      function removeApprovalCard() {
        Array.prototype.forEach.call(chat.querySelectorAll('.approval-card'), (c) => c.remove());
      }
      function showApprovalCard() {
        const p = pendingApproval;
        removeApprovalCard();
        if (!p) { lockInput(false); setStatus('Agent 就绪'); return; }
        const div = document.createElement('div');
        div.className = 'approval-card';
        const argsHtml = Object.keys(p.args || {}).map((k) =>
          '<div class="kv"><span>' + escapeHtml(k) + '</span><b>' + escapeHtml(String(p.args[k])) + '</b></div>').join('');
        div.innerHTML =
          '<div class="approval-title">⚠ 需要你确认</div>' +
          '<div class="approval-tool">工具：' + escapeHtml(p.tool) + '</div>' +
          (argsHtml ? '<div class="kv-list">' + argsHtml + '</div>' : '') +
          '<div class="approval-actions">' +
          '<button class="btn-approve" type="button">确认执行</button>' +
          '<button class="btn-reject" type="button">取消</button>' +
          '</div>';
        chat.appendChild(div);
        setStatus('等待确认');
        lockInput(true);
        div.querySelector('.btn-approve').addEventListener('click', () => resumeApproval('approve', div));
        div.querySelector('.btn-reject').addEventListener('click', () => resumeApproval('reject', div));
        scrollChat();
      }
      function resumeApproval(decision, card) {
        const p = pendingApproval;
        pendingApproval = null;
        if (!p) { removeApprovalCard(); lockInput(false); setStatus('Agent 就绪'); return; }
        if (card) {
          if (decision === 'approve') {
            card.classList.add('approved');
            card.innerHTML = '<div class="approval-title">✓ 已确认，正在执行…</div>';
          } else {
            card.remove();
          }
        }
        stallArm(aiElRef);
        currentChat = A.agentApprovalResume(
          { thread_id: p.threadId, decision: decision, tool: p.tool, args: p.args },
          wrapWatchdog(makeHandlers(aiElRef), aiElRef)
        );
      }

      function makeHandlers(aiEl) {
        return {
          onPhase: (p) => { setStage(p); },
          onText: (t) => { curAiText += t; renderAi(aiEl); },
          onToolCall: (d) => addToolCard(d),
          onToolArgs: (d) => accumulateArgs(d),
          onToolResult: (d) => { stashApproval(d); updateToolCard(d); },
          onDone: () => endReply(aiEl),
          onPause: () => showApprovalCard(),  // 11.4：最后 phase=awaiting_approval 且无 done → 暂停（非断连）
          onError: (e) => endReply(aiEl, e),
        };
      }

      // ---- SSE 看门狗：60s 无任何数据（含心跳注释）→ 判定连接死，强制收尾 + 同步检查点 ----
      // busy 只在 onDone/onError（→endReply）复位；若流既无 done 也无 error（连接挂起/传输
      // 静默），busy 会永久卡 true → 后续发送被 `if (busy) return` 静默丢弃。看门狗兜底：
      // 数据静默超时强制结束本轮，并从检查点拉取后端已落库的结果（后端断连仍会写检查点）。
      const STALL_TIMEOUT = 60000;
      let stallTimer = null;
      let stallEl = null;
      function stallReset() {
        if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
        stallEl = null;
      }
      function stallFire() {
        stallTimer = null;
        const el = stallEl; stallEl = null;
        if (!el || !currentChat) return;
        currentChat.cancel();
        currentChat = null;
        if (!busy) return;
        endReply(el, { kind: 'stream', message: '连接超时，已自动恢复' });
        loadThread(threadId);  // 从检查点同步最新会话内容（含后端断连后继续完成的结果）
      }
      function stallArm(el) {
        stallReset();
        stallEl = el;
        stallTimer = setTimeout(stallFire, STALL_TIMEOUT);
      }
      function stallKick() {  // 收到任意 SSE 块（含 `: ping` 心跳）→ 续命
        if (stallTimer && stallEl) {
          clearTimeout(stallTimer);
          stallTimer = setTimeout(stallFire, STALL_TIMEOUT);
        }
      }
      function wrapWatchdog(h, el) {  // 流收尾（done/error/审批暂停）必然解除看门狗
        const d = h.onDone, e = h.onError, p = h.onPause;
        return Object.assign({}, h, {
          onActivity: () => stallKick(),
          onDone: () => { stallReset(); d(); },
          onError: (err) => { stallReset(); e(err); },
          onPause: () => { stallReset(); p(); },
        });
      }

      function endReply(aiEl, err) {
        clearStage();
        if (err) {
          // 错误分支不覆盖已产出内容：先渲染已有文本（含 KaTeX），错误提示追加在下方
          if (curAiText) {
            aiEl.innerHTML = renderMarkdown(stripLeadingJson(curAiText));
            if (window.ChemKaTeX) window.ChemKaTeX.render(aiEl);
          }
          let msg;
          if (err.degradable) msg = 'AI 助手即将上线，敬请期待。';
          else if (err.kind === 'network') msg = '连接失败';
          else if (err.kind === 'forbidden') msg = '无权限：当前角色不能执行此操作';
          else if (err.kind === 'stream_error' || err.kind === 'http') msg = '对话出错，请重试';
          else msg = err.message || '连接中断';
          const card = document.createElement('div');
          card.className = 'degrade-card';
          card.innerHTML = msg + '<br><span class="retry">点击重试</span>';
          const r = card.querySelector('.retry');
          if (r) r.addEventListener('click', () => { if (lastText) send(lastText); });
          aiEl.appendChild(card);
        } else {
          window.ChemKaTeX.render(aiEl);
        }
        busy = false;
        lockInput(false);
        setStatus('Agent 就绪');
        scrollChat();
        loadHistoryList();  // 会话落库后刷新侧栏（新线程即时可见）
      }

      function send(text) {
        text = (text || '').trim();
        if (!text || busy) return;
        busy = true;
        lastText = text;
        persistThreadId();
        lockInput(true);
        input.value = '';
        appendUser(text);
        curAiText = '';
        pendingApproval = null;
        setStage('thinking');
        const aiEl = newAiBubble();
        // context 仅带登录用户信息；persona 绑定角色（B1）：teacher 角色 → teacher persona
        const handlers = wrapWatchdog(makeHandlers(aiEl), aiEl);
        stallArm(aiEl);
        currentChat = A.agentChatStream(
          { message: text, thread_id: threadId, context: { user_id: (me && me.user_id) || null, role: 'teacher', persona: 'teacher' } },
          handlers
        );
      }

      function newChat() {
        if (currentChat) currentChat.cancel();
        stallReset();
        busy = false;
        curAiText = '';
        lastText = '';
        pendingApproval = null;
        aiElRef = null;
        toolArgsBuffers = {};
        lockInput(false);
        setStatus('Agent 就绪');
        threadId = makeThreadId();
        persistThreadId();
        chat.innerHTML = '';
        addWelcome();
        renderHistoryList(historyItems);  // 更新侧栏高亮
      }

      $('sendBtn').addEventListener('click', () => send(input.value));
      $('newChatBtn').addEventListener('click', newChat);
      $('attachBtn').addEventListener('click', () => toast('附件上传即将上线'));
      // 历史对话：点击会话恢复（事件委托，innerHTML 渲染无法直绑）
      $('history').addEventListener('click', (e) => {
        const item = e.target.closest('.history-item');
        if (item && item.dataset.tid) loadThread(item.dataset.tid);
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          send(input.value);
        }
      });

      // 自适应练习预览「确认下发」——事件委托（innerHTML 渲染无法直绑）
      chat.addEventListener('click', (e) => {
        const btn = e.target.closest('.btn-confirm-adaptive');
        if (btn) confirmAdaptive(btn);
      });

      // ---------------- 初始化 ----------------
      populateClasses();
      renderChips();
      if (threadId) {
        loadThread(threadId);   // 恢复上次会话（跨 tab 持久化）
      } else {
        threadId = makeThreadId();
        persistThreadId();
        addWelcome();
      }
      loadHistoryList();
      input.focus();

      // ---------------- markdown / 净化 ----------------
      function sanitizeHtml(html) {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        doc.querySelectorAll('script, style, iframe, object, embed, link, meta, form').forEach((n) => n.remove());
        doc.querySelectorAll('*').forEach((n) => {
          Array.from(n.attributes).forEach((attr) => {
            const name = attr.name.toLowerCase();
            if (name.startsWith('on')) { n.removeAttribute(attr.name); return; }
            const val = attr.value.trim().toLowerCase();
            if ((name === 'href' || name === 'src') && (val.startsWith('javascript:') || val.startsWith('data:'))) {
              n.removeAttribute(attr.name);
            }
          });
        });
        return doc.body ? doc.body.innerHTML : '';
      }
      function renderMarkdown(text) {
        if (!text) return '';
        const s = String(text);
        if (window.marked) {
          try {
            const html = window.marked.parse ? window.marked.parse(s) : window.marked(s);
            return sanitizeHtml(html);
          } catch (err) { /* fallthrough */ }
        }
        return sanitizeHtml(s.replace(/\n/g, '<br>'));
      }
      // 剥离绿气泡前导的 JSON 回显（模型把工具结果 JSON 复述成文字回复，实时流先于叙述到达；
      // checkpoint 只存叙述，刷新后本就不显示——这里让实时流与刷新行为一致）。
      // 只处理「开头即 {/[ 」的情况；完整闭合且可解析→剥掉（含尾随空白）保留叙述；
      // 未闭合且出现非 JSON 字符（如中文叙述）→ 从该边界保留叙述；纯未闭合前缀→整体隐藏避免闪烁。
      function stripLeadingJson(text) {
        const s = String(text == null ? '' : text);
        let i = 0;
        while (i < s.length && /\s/.test(s[i])) i++;
        if (i >= s.length || (s[i] !== '{' && s[i] !== '[')) return s;
        const start = i;
        let depth = 0, inStr = false, esc = false, boundary = -1;
        for (let j = i; j < s.length; j++) {
          const c = s[j];
          if (inStr) {
            if (esc) esc = false;
            else if (c === '\\') esc = true;
            else if (c === '"') inStr = false;
            continue;
          }
          if (c === '"') { inStr = true; }
          else if (c === '{' || c === '[') depth++;
          else if (c === '}' || c === ']') {
            depth--;
            if (depth === 0) {
              try { JSON.parse(s.slice(start, j + 1)); }
              catch (err) { return s; }  // 已闭合但非合法 JSON → 不是回显，原样保留
              let k = j + 1;
              while (k < s.length && /\s/.test(s[k])) k++;
              return s.slice(k);
            }
          } else if (depth > 0 && boundary < 0 && !/[\s\d\-+.,:{}[\]]/.test(c) && !'truefalsneE'.includes(c)) {
            // 未闭合前缀中出现非 JSON 字符 → 记为叙述起点候选，继续扫描：
            // 若最终仍闭合且合法则走上面的剥离；闭合但非法则原样保留；始终未闭合才从边界保留。
            boundary = j;
          }
        }
        return boundary >= 0 ? s.slice(boundary) : '';
      }
      function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, (c) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
        }[c]));
      }
    })();
  </script>
</body>
