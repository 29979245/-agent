<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 智辅化学</title>
  <style>
    :root {
      --oxford: #002045;
      --teal: #13696a;
      --paper: #faf8f5;
      --ink: #1f2937;
      --muted: #6b7280;
      --congo: #b43c28;
      --line: rgba(0, 32, 69, .12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
      background: var(--paper); color: var(--ink); font-size: 14px;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .wrap { width: 360px; }
    .brand { text-align: center; font-size: 22px; font-weight: 700; letter-spacing: 2px; color: var(--oxford); margin-bottom: 4px; }
    .subtitle { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 26px 26px 20px; }
    .field { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; color: var(--muted); }
    input {
      border: 1px solid var(--line); border-radius: 4px; padding: 9px 12px;
      font-size: 14px; font-family: inherit; background: #fff; outline: none;
    }
    input:focus { border-color: var(--teal); }
    .btn {
      width: 100%; background: var(--teal); color: #fff; border: none; border-radius: 4px;
      padding: 10px; font-size: 14px; cursor: pointer; font-family: inherit;
    }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .msg { min-height: 20px; font-size: 13px; margin-top: 12px; text-align: center; }
    .msg.err { color: var(--congo); }
    .hint { margin-top: 14px; text-align: center; font-size: 12px; color: var(--muted); line-height: 1.8; }
    .hint code { background: var(--paper); border: 1px solid var(--line); padding: 1px 6px; border-radius: 3px; }
    .session-notice {
      display: none;
      font-size: 12px;
      line-height: 1.7;
      background: rgba(180, 60, 40, .06);
      border: 1px solid rgba(180, 60, 40, .25);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 16px;
      color: var(--congo);
    }
    .session-notice .act { display: block; margin-top: 8px; text-align: right; }
    .session-notice .act a,
    .session-notice .act button {
      font-size: 12px; color: var(--teal); background: none; border: none;
      cursor: pointer; text-decoration: underline; font-family: inherit; padding: 0 4px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">智辅化学</div>
    <div class="subtitle">考试工作台 · 教师登录</div>
    <div class="card">
      <div id="sessionNotice" class="session-notice"></div>
      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="username">用户名</label>
          <input id="username" name="username" required autocomplete="username" placeholder="请输入用户名" />
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="请输入密码" />
        </div>
        <button id="submitBtn" class="btn" type="submit">登 录</button>
      </form>
      <div id="msg" class="msg" aria-live="polite"></div>
    </div>
    <div class="hint">
      演示教师账号：<code>teacher_demo / demo123</code><br />
      仅教师及以上角色可进入出题工作台
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      'use strict';
      const form = document.getElementById('loginForm');
      const submitBtn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');

      function show(text, isErr) {
        msg.textContent = text || '';
        msg.className = 'msg' + (isErr ? ' err' : '');
      }
      function roleLabel(role) {
        return { teacher: '教师', admin: '管理员', dept_admin: '校级管理员', subject_lead: '学科负责人' }[role] || role;
      }

      // 已有会话：不自动跳转，改为展示当前登录状态；切换角色需先退出（本设备同一时间仅一个会话）
      (function () {
        const user = window.ChemAuth.getUser();
        if (!user || !window.ChemAuth.getToken()) return;
        const notice = document.getElementById('sessionNotice');
        const teacherLike = ['teacher', 'admin', 'dept_admin', 'subject_lead'].indexOf(user.role) !== -1;
        const name = user.name || '';
        if (teacherLike) {
          notice.innerHTML = '当前已登录教师端：' + name + '。' +
            '<span class="act"><a href="exam-v2.html">进入工作台</a> · <button id="sessionLogout">退出登录</button></span>';
        } else {
          notice.innerHTML = '当前已登录学生端：' + name + '。如需登录教师端，请先退出当前账号。' +
            '<span class="act"><button id="sessionLogout">退出登录</button></span>';
        }
        notice.style.display = 'block';
        const logoutBtn = document.getElementById('sessionLogout');
        if (logoutBtn) logoutBtn.addEventListener('click', function () {
          window.ChemAuth.logout();
          notice.style.display = 'none';
        });
      })();

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const username = form.username.value.trim();
        const password = form.password.value;
        if (!username || !password) {
          show('请输入用户名和密码', true);
          return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = '登录中…';
        show('', false);
        try {
          const data = await window.ChemAuth.login(
            username, password,
            ['teacher', 'admin', 'dept_admin', 'subject_lead'],
            '该账号不能通过教师端登录。学生账号请通过学生端登录。'
          );
          const target = window.ChemAuth.redirectAfterLogin();
          if (target) {
            show('登录成功，正在进入…', false);
            location.replace(target);
          } else {
            // 教师类角色但暂无可用页面：清除会话并提示
            window.ChemAuth.logout();
            show('无权限：当前角色暂无可用页面（当前角色：' + roleLabel(data.role) + '）', true);
          }
        } catch (err) {
          show((err && err.message) || '登录失败，请稍后重试', true);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = '登 录';
        }
      });
    })();
  </script>
</body>
</html>
