<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>错题本 · ChemAI 智辅化学</title>
  <link rel="stylesheet" href="css/student.css" />
  <link rel="stylesheet" href="vendor/katex.min.css" />
</head>
<body>
  <div class="app">

    <!-- VIEW 1 — 错题列表 -->
    <section id="view-list">
      <header class="topbar">
        <a class="icon-btn" href="profile.html" aria-label="返回我的">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="title">错题本</div>
        <div class="topbar-right">
          <a href="review.html">复习中心</a>
          <span id="studentName"></span>
        </div>
      </header>
      <section class="stats">
        <div class="stat"><div class="label">总错题</div><div class="num" id="statTotal">0</div></div>
        <div class="stat"><div class="label">本周新增</div><div class="num" id="statWeek">0</div></div>
        <div class="stat"><div class="label">已掌握</div><div class="num green" id="statMastered">0</div></div>
      </section>
      <main class="list" id="wrongList"></main>
    </section>

    <!-- VIEW 2 — 变式训练答题 -->
    <section id="view-train" class="hidden">
      <header class="topbar">
        <button class="icon-btn" aria-label="返回" onclick="backToList()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        </button>
        <div class="title">变式训练</div>
        <div class="topbar-right"><span id="trainProgress">0/0</span></div>
      </header>
      <div class="question-area" id="trainArea"></div>
      <div class="qnav">
        <button class="btn-prev" id="trainPrev" onclick="trainPrev()">上一题</button>
        <button class="btn-next" id="trainNext" onclick="trainNext()">下一题</button>
      </div>
    </section>

    <!-- VIEW 3 — 训练结果 -->
    <section id="view-result" class="hidden">
      <header class="topbar">
        <button class="icon-btn" aria-label="返回" onclick="backToList()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        </button>
        <div class="title">训练结果</div>
      </header>
      <div id="resultBox"></div>
      <div class="qnav">
        <button class="btn-next" onclick="backToList()" style="width:100%">返回错题本</button>
      </div>
    </section>

    <nav class="tabbar" id="tabbar"></nav>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/katex.min.js"></script>
  <script src="vendor/mhchem.min.js"></script>
  <script src="vendor/auto-render.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/katex.js"></script>
  <script src="js/student-common.js"></script>
  <script>
    (function () {
      'use strict';
      const SA = window.StudentApp;
      const A = window.ChemAPI;

      let items = [];                       // 错题列表
      let stats = { total: 0, week_new: 0, mastered: 0 };
      let trainQuestions = [];              // 变式题 [{question_id, content, options}]
      let trainAnswers = {};                // question_id -> option text
      let trainIndex = 0;
      let trainShortfall = 0;
      let trainResults = null;              // /train 响应
      let opSeq = 0;                        // 操作代际号：返回列表后使进行中的加载/提交失效

      const $ = (id) => document.getElementById(id);

      function renderChemRoot(root) { SA.renderChem(root); }

      async function load() {
        if (!SA.requireStudent()) return;
        const me = SA.getUser ? SA.getUser() : null;
        $('studentName').textContent = (me && me.name) || '';
        const data = await A.studentWrongQuestions(SA.studentId());
        items = data.items || [];
        stats = data.stats || { total: items.length, week_new: 0, mastered: 0 };
        render();
      }

      function render() {
        $('statTotal').textContent = stats.total;
        $('statWeek').textContent = stats.week_new;
        $('statMastered').textContent = stats.mastered;
        const el = $('wrongList');
        if (!items.length) {
          el.innerHTML = '';
          SA.emptyState(el, '暂无错题，继续保持！');
          return;
        }
        el.innerHTML = items.map((it, i) => {
          const diff = SA.difficultyLabel(it.difficulty);
          const diffCls = 'tag ' + (it.difficulty || 'medium');
          const summary = String(it.content || '').replace(/\s+/g, ' ').trim();
          const chips = (it.knowledge_points || []).map((kp) => '<span class="chip">' + SA.escapeHtml(kp) + '</span>').join('');
          const opts = (it.options || []).map((o, j) =>
            '<div class="opt-row"><span class="letter">' + String.fromCharCode(65 + j) + '</span>' +
            '<span>' + SA.renderMarkdown(o) + '</span></div>'
          ).join('');
          const yourAns = it.your_answer ? '<div class="ans-row wrong">你的答案：' + SA.renderMarkdown(it.your_answer) + '</div>' : '';
          const correctAns = it.answer ? '<div class="ans-row correct">正确答案：' + SA.renderMarkdown(it.answer) + '</div>' : '';
          const analysis = it.analysis ? '<div class="explain">解析：' + SA.renderMarkdown(it.analysis) + '</div>' : '';
          return '<article class="card">' +
            '<div class="card-header" onclick="window.__toggle(this)">' +
            '<div class="left"><span class="qnum">#' + (i + 1) + '</span>' +
            '<span class="' + diffCls + '">' + diff + '</span></div>' +
            '<svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>' +
            '</div>' +
            '<div class="summary">' + SA.escapeHtml(summary) + ' · 答错 ' + it.error_count + ' 次</div>' +
            '<div class="content"><div class="content-inner">' +
            '<p class="question">' + SA.renderMarkdown(it.content) + '</p>' +
            (opts ? '<div class="options">' + opts + '</div>' : '') +
            yourAns + correctAns + analysis +
            (chips ? '<div class="chips">' + chips + '</div>' : '') +
            '<div class="actions">' +
            '<button class="btn teal" onclick="window.__generate(' + it.question_id + ')">生成变式题</button>' +
            '<button class="btn oxford" onclick="window.__mastered(' + it.question_id + ')">已掌握</button>' +
            '</div></div></div>' +
            '</article>';
        }).join('');
        renderChemRoot(el);
      }

      function toggle(headerEl) {
        const card = headerEl.closest('.card');
        if (!card) return;
        const content = card.querySelector('.content');
        card.classList.toggle('expanded');
        content.style.maxHeight = card.classList.contains('expanded') ? content.scrollHeight + 'px' : '0px';
      }

      // ---- 变式训练 ----
      async function generate(questionId) {
        const seq = ++opSeq;
        SA.toast('正在生成变式题…');
        try {
          const data = await A.studentWrongVariants(questionId, 3);
          if (seq !== opSeq) return;  // 等待期间已返回列表，丢弃迟到响应
          trainQuestions = data.questions || [];
          trainShortfall = data.shortfall || 0;
          if (!trainQuestions.length) {
            SA.toast('暂无可用的变式题，请稍后再试');
            return;
          }
          trainAnswers = {};
          trainIndex = 0;
          renderTrain();
          $('view-list').classList.add('hidden');
          $('view-result').classList.add('hidden');
          $('view-train').classList.remove('hidden');
        } catch (err) {
          SA.toast('生成失败：' + ((err && err.message) || '请重试'));
        }
      }

      function renderTrain() {
        const q = trainQuestions[trainIndex];
        $('trainProgress').textContent = (trainIndex + 1) + '/' + trainQuestions.length;
        const opts = (q.options || []).map((opt, i) => {
          const letter = String.fromCharCode(65 + i);
          const selected = trainAnswers[q.question_id] === opt;
          const cls = selected ? ' option selected' : ' option';
          return '<button class="' + cls + '" data-opt="' + SA.escapeHtml(opt) + '" onclick="window.__pickTrain(this)">' +
            '<span class="letter">' + letter + '</span><span class="otext">' + SA.renderMarkdown(opt) + '</span><span class="mark">✓</span></button>';
        }).join('');
        $('trainArea').innerHTML =
          '<p class="stem">' + SA.renderMarkdown(q.content) + '</p>' +
          '<div class="options">' + opts + '</div>';
        renderChemRoot($('trainArea'));
        $('trainPrev').disabled = trainIndex === 0;
        $('trainNext').textContent = trainIndex === trainQuestions.length - 1 ? '提交' : '下一题';
      }

      function pickTrain(el) {
        const q = trainQuestions[trainIndex];
        trainAnswers[q.question_id] = el.getAttribute('data-opt');
        $('trainArea').querySelectorAll('.option').forEach((o) => o.classList.remove('selected'));
        el.classList.add('selected');
      }

      function trainPrev() {
        if (trainIndex > 0) { trainIndex -= 1; renderTrain(); }
      }

      function trainNext() {
        if (trainIndex < trainQuestions.length - 1) { trainIndex += 1; renderTrain(); }
        else submitTrain();
      }

      async function submitTrain() {
        const missing = trainQuestions.filter((q) => !trainAnswers[q.question_id]).length;
        if (missing > 0) {
          const ok = confirm('还有 ' + missing + ' 题未作答，确定提交吗？');
          if (!ok) return;
        }
        const payload = trainQuestions.map((q) => ({ question_id: q.question_id, selected_option: trainAnswers[q.question_id] || '' }));
        const seq = opSeq;
        const btn = $('trainNext');
        btn.disabled = true;
        btn.textContent = '提交中…';
        try {
          trainResults = await A.studentWrongTrain(SA.studentId(), payload);
          if (seq !== opSeq) return;  // 提交期间已返回列表，不强制翻到结果视图
          showTrainResult();
        } catch (err) {
          SA.toast('提交失败：' + ((err && err.message) || '请重试'));
        } finally {
          btn.disabled = false;
          btn.textContent = '提交';
        }
      }

      function showTrainResult() {
        $('view-train').classList.add('hidden');
        $('view-result').classList.remove('hidden');
        const res = trainResults.results || [];
        const acc = Math.round((res.filter((r) => r.is_correct).length / Math.max(trainResults.question_count, 1)) * 100);
        const rows = trainQuestions.map((q, i) => {
          const r = (trainResults.results || []).find((x) => x.question_id === q.question_id);
          const ok = r && r.is_correct;
          return '<article class="card" style="margin:0 16px 8px">' +
            '<div class="q-top"><div class="q-badge">' + (i + 1) + '</div>' +
            '<div class="q-summary">' + (ok ? '回答正确' : '回答错误') + '</div>' +
            '<span class="q-tag ' + (ok ? 'tag-green' : 'tag-red') + '">' + (ok ? '✓' : '✗') + '</span></div>' +
            (ok ? '' :
              '<div class="q-detail">' +
              (r && r.correct_answer ? '<div class="ans-row correct">正确答案：' + SA.renderMarkdown(r.correct_answer) + '</div>' : '') +
              (r && r.analysis ? '<div class="ans-row wrong">解析：' + SA.renderMarkdown(r.analysis) + '</div>' : '') +
              '</div>') +
            '</article>';
        }).join('');
        $('resultBox').innerHTML =
          '<div class="result-box"><div class="result-score">' + res.filter((r) => r.is_correct).length + '/' + trainResults.question_count + '</div>' +
          '<div class="result-label">正确率 ' + acc + '%</div></div>' +
          '<div class="section-title">逐题判定</div>' +
          rows +
          (trainShortfall > 0 ? '<div class="explain" style="padding:0 16px">部分知识点变式题不足，已展示全部可用题目。</div>' : '') +
          '<div class="explain" style="padding:8px 16px 16px">答错的题目已自动加入复习任务。</div>';
        renderChemRoot($('resultBox'));
      }

      // ---- 标记已掌握 ----
      async function mastered(questionId) {
        const ok = confirm('确认已掌握该题？将从错题本移除。');
        if (!ok) return;
        try {
          await A.studentWrongMastered(questionId, SA.studentId());
          SA.toast('已标记掌握');
          load();
        } catch (err) {
          SA.toast('操作失败：' + ((err && err.message) || '请重试'));
        }
      }

      function backToList() {
        opSeq += 1;  // 使进行中的加载/提交失效
        $('view-train').classList.add('hidden');
        $('view-result').classList.add('hidden');
        $('view-list').classList.remove('hidden');
        load();
      }

      window.__toggle = toggle;
      window.__generate = generate;
      window.__mastered = mastered;
      window.__pickTrain = pickTrain;
      window.backToList = backToList;

      SA.renderTabbar('wrong');
      load().catch((err) => {
        if (!err) return;
        if (err.status === 401) return;  // 已由 api.js 处理跳转
        if (err.status === 403) {
          $('wrongList').innerHTML = '';
          SA.emptyState($('wrongList'), '无权限访问错题本');
          return;
        }
        $('wrongList').innerHTML = '';
        SA.emptyState($('wrongList'), ((err && err.message) || '加载失败，请重试'));
      });
    })();
  </script>
</body>
</html>
